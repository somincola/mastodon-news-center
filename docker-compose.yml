# ============================================
# Mastodon News Center - 本地开发环境配置
# ============================================
# 
# 用途：本地开发和调试
# 特点：
#   - 数据库端口暴露到宿主机（方便本地工具连接）
#   - 应用代码热重载（volume 挂载）
#   - 日志文件挂载到宿主机
#
# 启动方式：
#   docker compose up -d --build
#
# ============================================

services:
  db:
    image: postgres:15-alpine
    container_name: mastodon-news-db
    environment:
      # ⚠️ 请确保在 .env 文件中设置强密码！
      POSTGRES_USER: ${POSTGRES_USER:-mastodon_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-mastodon_news}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 开发环境：暴露数据库端口到宿主机（方便使用 pgAdmin、DBeaver 等工具）
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - mastodon_news_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mastodon_news} -d ${POSTGRES_DB:-mastodon_news}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: mastodon-news-app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level info
    volumes:
      # 开发环境：挂载应用代码（支持热重载）
      - ./app:/app/app
      - ./logs:/app/logs
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mastodon_news}:${POSTGRES_PASSWORD:-changeme_in_production}@db:5432/${POSTGRES_DB:-mastodon_news}
      - MASTODON_BASE_URL=${MASTODON_BASE_URL:-https://your-instance.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-123456}
      - MASTODON_MAX_LENGTH=${MASTODON_MAX_LENGTH:-500}
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mastodon_news_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mastodon_news_network:
    name: mastodon_news_network
    driver: bridge
    # 独立网络，避免与其他服务冲突

volumes:
  postgres_data:
    # 不指定 name，使用 Docker Compose 默认命名规则
    # 会自动使用：mastodon-news-center_postgres_data（与现有数据卷匹配）
